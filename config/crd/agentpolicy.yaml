# AgentPolicy CRD (hand-written for v0.1; controller-gen takes over with the M3
# operator). Applying this makes `kubectl get agentpolicy` work on the cluster —
# the K8s-native contract is present even before the controller reconciles it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentpolicies.acra.dev
spec:
  group: acra.dev
  names:
    kind: AgentPolicy
    listKind: AgentPolicyList
    plural: agentpolicies
    singular: agentpolicy
    shortNames: [ap]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Agent
          type: string
          jsonPath: .spec.agent
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Open
          type: string
          jsonPath: .status.openTickets
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [agent]
              properties:
                agent:
                  type: string
                approvedTuples:
                  type: array
                  items:
                    type: object
                    properties:
                      prompt:   { type: string }
                      manifest: { type: string }
                      ruleset:  { type: string }
                      formula:  { type: string }
                baseline:
                  type: object
                  properties:
                    ref: { type: string }
                invariants:
                  type: array
                  items: { type: string }
                thresholds:
                  type: object
                  properties:
                    driftMagnitude:      { type: integer }
                    minIndependentRoots: { type: integer }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
