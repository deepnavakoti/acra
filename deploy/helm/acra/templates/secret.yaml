{{- if not .Values.auth.existingSecret }}
{{- $name := include "acra.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
{{- $api := .Values.auth.apiToken | default (get $data "api-token" | default "" | b64dec) | default (randAlphaNum 40) }}
{{- $ingest := (get $data "ingest-token" | default "" | b64dec) | default (randAlphaNum 40) }}
{{- $key := .Values.auth.signingKey | default (get $data "signing-key" | default "" | b64dec) | default (sha256sum (randAlphaNum 64)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "acra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # losing signing-key would make the evidence chain unverifiable
type: Opaque
stringData:
  api-token: {{ $api | quote }}
  ingest-token: {{ $ingest | quote }}
  api-tokens: {{ printf "%s:otel-collector:ingest" $ingest | quote }}
  signing-key: {{ $key | quote }}
{{- end }}
