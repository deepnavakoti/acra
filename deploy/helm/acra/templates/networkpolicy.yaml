{{- if and .Values.networkPolicy.enabled .Values.collector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "acra.fullname" . }}-collector
  labels: {{ include "acra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "acra.selector" (dict "Release" .Release "component" "collector") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
      {{- if .Values.networkPolicy.ingressNamespaceSelectors }}
      from:
        {{- range .Values.networkPolicy.ingressNamespaceSelectors }}
        - namespaceSelector: {{ toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
{{- end }}
