name: release

# Tag vX.Y.Z -> multi-arch image to GHCR, Helm chart to GHCR (OCI) and a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./... && go test ./...

      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/acra:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/acra:latest

      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/acra
      - name: Package and push chart
        run: |
          helm package deploy/helm/acra --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/acra-${{ steps.v.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/acra-*.tgz
          generate_release_notes: true
