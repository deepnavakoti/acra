# Deploys the console as a zero-install live preview on GitHub Pages.
# The console falls back to its built-in seed data when no /v1 backend is
# present, so the hosted page renders a populated, read-only dashboard.
# After the first push: enable Pages (Settings → Pages → Source: GitHub Actions).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on from the workflow (no manual Settings step)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: console
      - id: deployment
        uses: actions/deploy-pages@v4
