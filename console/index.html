<meta charset="utf-8">
<title>ACRA Console</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: fixed left rail of screens, scrolling content; summary strip before detail on every screen. */
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#16212B; --muted:#5C6B78; --line:#D8DEE4; --soft:#EAEEF2;
  --accent:#0F6E75; --accent-ink:#FFFFFF; --good:#1F7A4D; --warn:#B7791F; --crit:#B3261E;
  --good-bg:#E3F3EA; --warn-bg:#FBF0DC; --crit-bg:#F9E3E1; --accent-bg:#DDEFF0;
  --sans:'IBM Plex Sans',system-ui,Segoe UI,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --panel:#161E26; --ink:#E6ECF1; --muted:#97A5B1; --line:#2A3540; --soft:#1E2831;
    --accent:#4FB3BA; --accent-ink:#06282A; --good:#5DCB8E; --warn:#E3B04B; --crit:#F08A80;
    --good-bg:#153324; --warn-bg:#3A2D12; --crit-bg:#3E1C19; --accent-bg:#163538; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --panel:#161E26; --ink:#E6ECF1; --muted:#97A5B1; --line:#2A3540; --soft:#1E2831;
  --accent:#4FB3BA; --accent-ink:#06282A; --good:#5DCB8E; --warn:#E3B04B; --crit:#F08A80;
  --good-bg:#153324; --warn-bg:#3A2D12; --crit-bg:#3E1C19; --accent-bg:#163538; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.brand b{font-weight:600;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px}
.nav button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .n{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--soft);padding:1px 6px;border-radius:10px}
.nav button[aria-current="page"] .n{background:var(--panel)}
.railfoot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
.railfoot code{font-family:var(--mono);font-size:11px}
.main{padding-block:20px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
@media (max-width:900px){.g4,.g3,.g2,.g21{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.railfoot{display:none}.brand{width:100%}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--good-bg);color:var(--good)} .warn{background:var(--warn-bg);color:var(--warn)} .crit{background:var(--crit-bg);color:var(--crit)} .info{background:var(--accent-bg);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--soft)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.tw{overflow-x:auto}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.w i{background:var(--warn)} .bar.c i{background:var(--crit)}
.stripe{border-left:4px solid var(--line)}
.stripe.crit{border-left-color:var(--crit)} .stripe.warn{border-left-color:var(--warn)} .stripe.ok{border-left-color:var(--good)}
.btn{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;border:1px solid var(--line);font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:8px;padding:10px;position:relative}
.step .t{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.step .s{font-weight:600;margin:2px 0}
.step.done{border-color:var(--good);background:var(--good-bg)}
.step.now{border-color:var(--accent);background:var(--accent-bg)}
.hyp{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.hyp:last-child{border-bottom:0}
.hyp .c{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--accent);font-weight:600}
.chain{font-family:var(--mono);font-size:12px}
.chain .e{display:grid;grid-template-columns:70px 120px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.chain .e:last-child{border-bottom:0}
.chain .k{color:var(--muted)}
.kern{color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
svg text{font-family:var(--sans)}
.sig{background:var(--soft);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;word-break:break-all}
.field{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px}
.field dt{color:var(--muted)} .field dd{margin:0}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:13px}
.diffrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.diffrow:last-child{border-bottom:0}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}}
</style>

function spark(vals, w=160, h=36, color="var(--accent)", band){
  const max=Math.max(...vals, band||0)||1, min=0;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*w, h-((v-min)/(max-min))*(h-4)-2]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${w} ${h} L0 ${h} Z`;
  const last=pts[pts.length-1];
  const bandLine = band? `<line x1="0" x2="${w}" y1="${(h-((band-min)/(max-min))*(h-4)-2).toFixed(1)}" y2="${(h-((band-min)/(max-min))*(h-4)-2).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${area}" fill="${color}" opacity=".12"/>${bandLine}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/></svg>`;
}
function lineChart(series, labels, {w=640,h=200,band}={}){
  const all=series.flatMap(s=>s.v); const max=Math.ceil(Math.max(...all,(band?band[0]+band[1]:0))+1), min=Math.floor(Math.min(...all,(band?band[0]-band[1]:1e9))-1);
  const px=i=>40+(i/(labels.length-1))*(w-60), py=v=>h-30-((v-min)/(max-min))*(h-50);
  let g='';
  for(let k=0;k<=4;k++){const v=min+(max-min)*k/4; g+=`<line x1="40" x2="${w-20}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)"/><text x="34" y="${py(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v.toFixed(0)}</text>`;}
  let bandRect=''; if(band){bandRect=`<rect x="40" y="${py(band[0]+band[1])}" width="${w-60}" height="${py(band[0]-band[1])-py(band[0]+band[1])}" fill="var(--good)" opacity=".10"/><line x1="40" x2="${w-20}" y1="${py(band[0])}" y2="${py(band[0])}" stroke="var(--good)" stroke-dasharray="4 3"/>`;}
  const paths=series.map(s=>{const d=s.v.map((v,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1)).join(' '); const last=s.v.length-1; return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2"/><circle cx="${px(last)}" cy="${py(s.v[last])}" r="3.5" fill="${s.c}"/>`;}).join('');
  const xl=labels.map((l,i)=> (i%5===0||i===labels.length-1)?`<text x="${px(i)}" y="${h-12}" text-anchor="middle" font-size="10" fill="var(--muted)">${l}</text>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="trend">${g}${bandRect}${paths}${xl}</svg>`;
}
function stackedBars(idx, layers, w=640, h=150){
  const colors={Cluster:"#6B7F8E",Kong:"#8E6B8A",Endpoints:"var(--warn)",Agents:"var(--crit)",Evaluation:"var(--accent)",Evidence:"#4A7A6A"};
  const n=idx[layers[0]].length; const totals=Array.from({length:n},(_,i)=>layers.reduce((a,l)=>a+idx[l][i],0)); const max=Math.max(...totals,1);
  const bw=(w-50)/n-2; let out='';
  for(let i=0;i<n;i++){let y=h-24; for(const l of layers){const v=idx[l][i]; if(!v)continue; const hh=(v/max)*(h-40); y-=hh; out+=`<rect x="${40+i*(bw+2)}" y="${y}" width="${bw}" height="${hh}" fill="${colors[l]}" rx="1"><title>${l}: ${v}</title></rect>`;}}
  const ax=`<line x1="40" x2="${w-10}" y1="${h-24}" y2="${h-24}" stroke="var(--line)"/><text x="40" y="${h-8}" font-size="10" fill="var(--muted)">30 days ago</text><text x="${w-10}" y="${h-8}" text-anchor="end" font-size="10" fill="var(--muted)">today</text><text x="34" y="${h-26}" text-anchor="end" font-size="10" fill="var(--muted)">0</text><text x="34" y="20" text-anchor="end" font-size="10" fill="var(--muted)">${max}</text>`;
  const legend=layers.map(l=>`<span><i style="background:${colors[l]}"></i>${l}</span>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="drift index by layer, 30 days">${out}${ax}</svg><div class="legend">${legend}</div>`;
}

    const chart=`<div class="card"><h2>Drift index by domain · 30 days</h2>${stackedBars(d.overview.driftIndex30d,d.overview.layers)}<div class="note">Index = sum of open-ticket magnitudes weighted by confidence. The last three days are evidence-domain holds: lineage, provenance and freshness.</div></div>`;
    const fresh=`<div class="card"><h2>Contract freshness</h2><table><tr><th>Domain</th><th>Signed</th><th>Status</th></tr>${d.overview.layers.map(l=>{const a=d.overview.baselineAge[l];return `<tr><td>${l}</td><td class="mono">${a} d ago</td><td>${a>7?'<span class="pill warn">Review</span>':'<span class="pill ok">Fresh</span>'}</td></tr>`;}).join('')}</table></div>`;
    const list=`<div class="card"><h2>Needs attention</h2><div class="tw"><table>${open.map(t=>`<tr class="row stripe ${t.sev}" data-ticket="${t.id}"><td class="mono">${t.id}</td><td>${sevPill(t.sev)}</td><td>${esc(t.title)}</td><td><span class="pill ${statePill(t.state)}">${t.state}</span></td><td class="mono muted">${t.radius}</td></tr>`).join('')}</table></div></div>`;
    return header("Production is green on every Pod and every call returned 200. Four tasks are held at the gate.","ACRA · eks-east-1 · 6 agents, 5 adapters, 4 model routes")+kpis+`<div class="grid g21" style="margin-top:14px">${chart}${fresh}</div><div style="margin-top:14px">${list}</div>`;
  },
  tickets(d){
    if(state.ticket){return R.ticket(d,d.tickets.find(t=>t.id===state.ticket));}
    const rows=d.tickets.map(t=>`<tr class="row stripe ${t.sev}" data-ticket="${t.id}"><td class="mono">${t.id}</td><td>${sevPill(t.sev)}</td><td>${t.layer}</td><td>${esc(t.title)}</td><td><span class="pill ${statePill(t.state)}">${t.state}</span></td><td class="mono">${(t.confidence*100).toFixed(0)} %</td><td class="mono muted">${t.radius}</td><td class="mono muted">${t.opened.slice(5,16).replace('T',' ')}</td></tr>`).join('');
    return header("Tickets","Every drift is a record that walks detect → hold → investigate → authorise → remediate → verify. Nothing closes without a passing re-run.")+`<div class="card"><div class="tw"><table><tr><th>ID</th><th>Severity</th><th>Domain</th><th>Finding</th><th>Stage</th><th>Confidence</th><th>Blast radius</th><th>Opened</th></tr>${rows}</table></div></div>`;
  },
  ticket(d,t){
    const stages=["detect","hold","investigate","authorise","remediate","verify"]; const idx=t.state==='closed'?6:stages.indexOf(t.state);
    const steps=stages.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'now':''}"><div class="t">${i+1}</div><div class="s">${s}</div><div class="muted" style="font-size:12px">${(t.history.find(h=>h[1]===s)||['','','—'])[2]}</div></div>`).join('');
    const hyps=t.hyps.map(h=>`<div class="hyp"><span class="c">${(h.c*100).toFixed(0)} %</span><span>${esc(h.t)}</span></div>`).join('');
    const canApprove=t.state==='authorise';
    return `<div class="top"><div><button class="btn" id="back">← Tickets</button></div><div class="stamp">${t.id}</div></div>
    <div class="card stripe ${t.sev}" style="margin-bottom:14px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${sevPill(t.sev)}<span class="pill info">${t.layer}</span><span class="pill ${statePill(t.state)}">${t.state}</span></div><h1 style="font-size:18px;margin:8px 0 0">${esc(t.title)}</h1></div>
    <div class="steps" style="margin-bottom:14px">${steps}</div>
    <div class="grid g3">
      <div class="card kpi"><span class="l">Magnitude</span><span class="v" style="font-size:18px">${esc(t.magnitude)}</span><span class="d muted">detector ${t.detector}</span></div>
      <div class="card kpi"><span class="l">Confidence</span><span class="v">${(t.confidence*100).toFixed(0)} %</span><span class="d muted">z-score vs baseline variance</span></div>
      <div class="card kpi"><span class="l">Blast radius</span><span class="v" style="font-size:18px">${esc(t.radius)}</span><span class="d muted">from version stamps on outputs</span></div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h2>Investigator hypotheses (read-only model)</h2>${hyps}<div class="note">The investigator proposes causes. It cannot change budgets, policies, routes or task records.</div></div>
      <div class="card"><h2>Proposed action</h2><dl class="field"><dt>Action</dt><dd class="mono">${t.action.name}</dd><dt>Parameters</dt><dd class="mono">${esc(JSON.stringify(t.action.params))}</dd><dt>Blast radius</dt><dd>${esc(t.action.radius)}</dd><dt>Approval band</dt><dd>${t.action.band==='pre-approved'?'<span class="pill ok">within pre-approved band · rule may sign</span>':'<span class="pill warn">human signature required</span>'}</dd><dt>Bundle</dt><dd class="mono">${t.bundle}</dd><dt>Model pin</dt><dd class="mono">${t.modelPin}</dd></dl>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn primary" id="approve" ${canApprove?'':'disabled'}>Sign and approve</button><button class="btn" id="verify" ${t.state==='remediate'||t.state==='verify'?'':'disabled'}>Request verification</button><button class="btn" id="toev">Open evidence ${t.evidence}</button></div>
      <div class="sig" style="margin-top:10px">signature: ed25519 · signer key ${canApprove?'(your registered key)':'—'} · payload sha256 of action+params</div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>History (append-only)</h2><div class="chain">${t.history.map(h=>`<div class="e"><span class="k">${h[0]}</span><span>${h[1]}</span><span>${esc(h[2])}</span></div>`).join('')}</div></div>`;
  },
  fleet(d){
    const rows=d.fleet.tasks.map(t=>{const tp=t.tokens[0]/t.tokens[1]*100, cp=Math.min(t.calls[0]/t.calls[1]*100,100); const over=t.calls[0]>t.calls[1];
      return `<tr class="stripe ${t.state==='paused'||t.state==='failed'?'crit':t.state==='waiting'?'warn':'ok'}"><td class="mono">${t.id}</td><td>${t.type}</td><td class="mono muted">${t.worker}</td><td><span class="pill ${t.state==='running'?'ok':t.state==='done'?'info':t.state==='waiting'?'warn':'crit'}">${t.state}</span></td><td class="mono">${t.step}</td>
      <td><div class="bar ${tp>85?'w':''}"><i style="width:${tp.toFixed(0)}%"></i></div><span class="mono muted">${(t.tokens[0]/1000).toFixed(1)}k / ${(t.tokens[1]/1000).toFixed(0)}k</span></td>
      <td><div class="bar ${over?'c':cp>80?'w':''}"><i style="width:${cp.toFixed(0)}%"></i></div><span class="mono ${over?'':'muted'}" style="${over?'color:var(--crit)':''}">${t.calls[0]} / ${t.calls[1]}${over?' · refused':''}</span></td>
      <td class="mono">${t.lease}</td><td class="mono">${t.fence}</td><td class="mono ${t.reissues>1?'':'muted'}" style="${t.reissues>1?'color:var(--warn)':''}">${t.reissues}</td></tr>`;}).join('');
    const bands=Object.entries(d.fleet.bands).map(([k,v])=>`<tr><td>${k}</td><td class="mono">${v.calls}</td><td class="mono">${v.step}</td><td class="mono">${v.tokens}</td><td class="mono">${v.reissue}</td></tr>`).join('');
    return header("Fleet","One task, one worker, one key. Spend is against the budget inside the task key; the ledger lives in Redis at Kong.")+
    `<div class="grid g21"><div class="card"><h2>Tasks</h2><div class="tw"><table><tr><th>Task</th><th>Type</th><th>Worker</th><th>State</th><th>Step</th><th>Tokens</th><th>Calls</th><th>Lease</th><th>Fence</th><th>Key re-issues</th></tr>${rows}</table></div></div>
    <div><div class="card"><h2>Key re-issues · 24 h</h2>${spark(d.fleet.reissues24h,260,56,'var(--warn)')}<div class="note">Rising since 16:00. A re-issue means a task outlived its key: the early sign of a slow route, before any 429.</div></div>
    <div class="card" style="margin-top:14px"><h2>Normal bands (from 30 days)</h2><table><tr><th>Type</th><th>Calls</th><th>Step</th><th>Tokens</th><th>Re-issue</th></tr>${bands}</table></div></div></div>`;
  },
  endpoints(d){
    const cards=d.endpoints.map(e=>{const regions=Object.entries(e.served24h).map(([r,p])=>`<span class="mono">${r} ${p}%</span>`).join(' · ');
      return `<div class="card stripe ${e.status==='ok'?'ok':'warn'}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>${e.route}</b>${e.status==='ok'?'<span class="pill ok">in band</span>':'<span class="pill warn">attention</span>'}</div>
      <dl class="field" style="margin-top:10px"><dt>Provider · pin</dt><dd class="mono">${e.provider} · ${esc(e.pin)}</dd><dt>Lifecycle</dt><dd>${e.lifecycle.includes('Legacy')?'<span class="pill warn">'+e.lifecycle+'</span>':e.lifecycle}</dd><dt>Served regions 24 h</dt><dd>${regions}<br><span class="muted">allowed: ${e.regions.join(', ')}</span></dd><dt>Admission semaphore</dt><dd class="mono">${e.sem[1]} in flight max ${e.sem[0]!==e.sem[1]?'<span class="pill warn">lowered from '+e.sem[0]+'</span>':''}</dd><dt>Quota headroom</dt><dd class="mono">${e.quota}</dd><dt>Cost</dt><dd class="mono">${e.cost}</dd></dl>
      <div class="grid g3" style="margin-top:10px;gap:8px"><div><div class="muted" style="font-size:11px">TTFT P99 (s) · band ${e.band}</div>${spark(e.ttft,150,40,e.status==='ok'?'var(--good)':'var(--warn)',e.band)}</div><div><div class="muted" style="font-size:11px">429 / h</div>${spark(e.r429,150,40,'var(--crit)')}</div><div><div class="muted" style="font-size:11px">invalid 200s / h</div>${spark(e.invalid,150,40,'var(--crit)')}</div></div></div>`;}).join('');
    return header("Endpoints","We own no GPU. Every route is pinned, polled for lifecycle, checked for region, and watched for a busy provider.")+`<div class="grid g2">${cards}</div>`;
  },
  evaluation(d){
    const a=d.evaluation.agents[state.agent]; const labels=Array.from({length:a.nightly.length},(_,i)=>`d-${a.nightly.length-1-i}`);
    const tabs=Object.keys(d.evaluation.agents).map(k=>`<button class="btn ${k===state.agent?'primary':''}" data-agent="${k}">${k}</button>`).join(' ');
    const attr=a.attribution.map(([k,v])=>`<div class="diffrow"><span class="mono">${k}</span><div class="bar ${v<-1?'c':v<0?'w':''}" style="min-width:120px"><i style="width:${Math.min(Math.abs(v)*25,100)}%"></i></div><span class="mono" style="color:${v<-1?'var(--crit)':'var(--ink)'}">${v>0?'+':''}${v.toFixed(1)} pts</span><span></span></div>`).join('');
    const pre=d.evaluation.preprod.map(p=>`<tr class="stripe ${p.result.startsWith('blocked')?'crit':'ok'}"><td class="mono">${p.bundle}</td><td class="mono">${p.business}</td><td class="mono">${p.user}</td><td class="mono">${p.edge}</td><td>${p.result.startsWith('blocked')?'<span class="pill crit">'+p.result+'</span>':'<span class="pill ok">'+p.result+'</span>'}</td></tr>`).join('');
    return header("Evaluation","Accuracy is a nightly number with a band, replayed from yesterday’s redacted traffic and judged by a second model family.")+
    `<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">${tabs}</div>
    <div class="grid g21"><div class="card"><h2>Nightly score · band ${a.band[0]} ± ${a.band[1]}</h2>${lineChart([{v:a.nightly,c:'var(--accent)'}],labels,{band:a.band})}<div class="note">Dip 11 days ago was an unapproved tuple (ACRA-3104, rolled back). The last two nights are in band; the held tasks are excluded from the score until released.</div></div>
    <div><div class="card"><h2>Attribution (last night)</h2>${attr}</div><div class="card" style="margin-top:14px"><h2>Judge</h2><div class="mono">${a.judge}</div><div class="note">Second model family, pinned. If calibration moves, the night is marked unreliable and no ticket is raised.</div></div></div></div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h2>P99 of per-case scores</h2>${lineChart([{v:a.p99,c:'var(--warn)'}],labels)}<div class="note">The tail moves before the mean. Loops and retries hurt a few cases badly.</div></div>
    <div class="card"><h2>Tool accuracy (last night)</h2><table><tr><th>Server</th><th>Parseable</th><th>Used correctly</th><th>Errors</th></tr><tr><td class="mono">lookup-tools 1.8.3</td><td class="mono">99.1 %</td><td class="mono">96.4 %</td><td class="mono">429 ×3</td></tr><tr><td class="mono">writeback-tools 2.2.0</td><td class="mono">100 %</td><td class="mono">98.8 %</td><td class="mono">0</td></tr><tr><td class="mono">document-tools 1.4.1</td><td class="mono">97.3 %</td><td class="mono">94.0 %</td><td class="mono">timeout ×6</td></tr></table><div class="note">Scored by the nightly replay alongside agent accuracy; a drop below the server’s band is a tool drift ticket, not an agent one.</div></div>
    <div class="card"><h2>Golden-set template</h2><table><tr><th>Section</th><th>Cases</th><th>Pass rule</th></tr><tr><td>Business-approved</td><td class="mono">${a.set.business}</td><td>all must pass</td></tr><tr><td>User-approved</td><td class="mono">${a.set.user}</td><td>≥ 98 %, no regression</td></tr><tr><td>Rare and real edges</td><td class="mono">${a.set.edge}</td><td>mean within band</td></tr></table><div class="note">Refreshed ${a.set.refreshed} · 10–20 % monthly from capture</div></div></div>
    <div class="card" style="margin-top:14px"><h2>Pre-production gate</h2><div class="tw"><table><tr><th>Bundle</th><th>Business</th><th>User</th><th>Edge</th><th>Result</th></tr>${pre}</table></div></div>`;
  },
  baselines(d){
    const cards=d.baselines.map(b=>{const worst=b.fields.some(f=>f[3]==='crit')?'crit':b.fields.some(f=>f[3]==='warn')?'warn':'ok';
      return `<div class="card stripe ${worst}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>${b.layer}</b><span class="mono muted">${b.version} · signed ${b.signed} · ${b.approvers}</span></div>
      <div style="margin-top:8px">${b.fields.map(f=>`<div class="diffrow"><span>${f[0]}</span><span class="mono muted">baseline ${esc(f[1])}</span><span class="mono">live ${esc(f[2])}</span>${f[3]==='ok'?'<span class="pill ok">match</span>':f[3]==='warn'?'<span class="pill warn">drift</span>':'<span class="pill crit">drift</span>'}</div>`).join('')}</div></div>`;}).join('');
    return header("Baselines","Signed snapshots of what we agreed, per layer. They change only by pull request with two approvers; the control plane signs the merge.")+`<div class="grid g2">${cards}</div>`;
  },
  evidence(d){
    const keys=Object.keys(d.evidence||{});
    if(keys.length===0){return header("Evidence","Every hop for one task, kernel events inline, chain verified. The export is signed; nothing is assembled by hand.")+`<div class="card"><div class="muted">No traces yet. Inject a drift — e.g. <span class="mono">workload inject-drift combinative</span> — to generate a signed evidence trace.</div></div>`;}
    if(!d.evidence[state.evidence]) state.evidence=keys[0];
    const e=d.evidence[state.evidence]; const opts=keys.map(k=>`<option ${k===state.evidence?'selected':''}>${k}</option>`).join('');
    return header("Evidence","Every hop for one task, kernel events inline, chain verified. The export is signed; nothing is assembled by hand.")+
    `<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label for="evsel" class="muted">trace</label><select id="evsel" style="padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--mono)">${opts}</select><span class="pill ok">chain ${e.chain}</span><button class="btn" id="export">Signed export</button></div>
    <dl class="field" style="margin-top:12px"><dt>task_id</dt><dd class="mono">${e.task}</dd><dt>caller</dt><dd class="mono">${e.caller}</dd><dt>bundle</dt><dd class="mono">${e.bundle}</dd></dl>
    <div class="chain" style="margin-top:12px">${e.entries.map(x=>`<div class="e"><span class="k">${x[0]}</span><span class="${x[1]==='kernel'?'kern':''}">${x[1]}</span><span>${esc(x[2])}</span></div>`).join('')}</div>
    <div class="note">Kernel rows come from the eBPF probe; they are what prove a worker did, or did not, reach a host directly.</div></div>`;
  },
  policy(d){
    return header("Policy","Kyverno blocks at the door; the same policies run every five minutes against what is already there. ACRA reads both.")+
    `<div class="grid g2"><div class="card"><h2>Policies</h2><table><tr><th>Policy</th><th>Mode</th><th>Last scan</th></tr>${d.policy.policies.map(p=>`<tr><td class="mono">${p[0]}</td><td>${p[1]==='Enforce'?'<span class="pill ok">Enforce</span>':'<span class="pill warn">Audit</span>'}</td><td class="muted">${p[2]}</td></tr>`).join('')}</table><div class="note">${d.policy.lastScan}</div></div>
    <div class="card"><h2>Propose · validate · approve · apply</h2><table><tr><th>Item</th><th>Action</th><th>Validation</th><th>Approval</th></tr>${d.policy.queue.map(q=>`<tr><td class="mono">${q[0]}</td><td class="mono">${q[1]}</td><td><span class="pill ok">${q[2]}</span></td><td><span class="pill warn">${q[3]}</span></td></tr>`).join('')}</table><div class="note">A signature covers the exact bytes of the change. A swapped change fails verification at apply.</div></div></div>`;
  }
};

function render(){
  const d=DATA; const nav=$('#nav');
  nav.innerHTML=SCREENS.map(s=>`<button data-screen="${s.id}" ${s.id===state.screen?'aria-current="page"':''}>${s.name}${s.count?`<span class="n">${s.count(d)}</span>`:''}</button>`).join('');
  $('#main').innerHTML=R[state.screen](d);
  $('#lastpoll').textContent=new Date().toLocaleTimeString();
  try{history.replaceState(null,'','#'+state.screen);}catch(e){}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-screen]'); if(b){state.screen=b.dataset.screen;state.ticket=null;render();return;}
  const r=e.target.closest('[data-ticket]'); if(r){state.screen='tickets';state.ticket=r.dataset.ticket;render();window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-agent]'); if(a){state.agent=a.dataset.agent;render();return;}
  if(e.target.id==='back'){state.ticket=null;render();return;}
  if(e.target.id==='toev'){const t=DATA.tickets.find(x=>x.id===state.ticket);state.evidence=t.evidence;state.screen='evidence';state.ticket=null;render();return;}
  if(e.target.id==='approve'){const t=DATA.tickets.find(x=>x.id===state.ticket);t.state='remediate';t.history.push([new Date().toISOString().slice(11,19),'authorise','signed (demo key) · action '+t.action.name]);t.history.push([new Date().toISOString().slice(11,19),'remediate',t.action.name+' applied']);toast('Signed. Action applied; verification scheduled.');render();return;}
  if(e.target.id==='verify'){const t=DATA.tickets.find(x=>x.id===state.ticket);t.state='verify';t.history.push([new Date().toISOString().slice(11,19),'verify','detector re-run requested']);toast('Verification requested: the detector that opened the ticket runs again.');render();return;}
  if(e.target.id==='export'){toast('Signed export prepared (demo).');return;}
});
document.addEventListener('change',e=>{if(e.target.id==='evsel'){state.evidence=e.target.value;render();}});
/* Live wiring: merge the apiserver's snapshot (tickets + evidence) over the
   built-in seed, then render. Falls back to the seed if served as a static file. */
async function refresh(){try{const r=await fetch('/v1/snapshot');if(r.ok){const j=await r.json();if(j&&j.data){Object.assign(DATA,j.data);}}}catch(e){}render();}
refresh();
setInterval(refresh,3000);
</script>
